<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivunjisha Offline</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 25px;
            border: 1px solid #e2e8f0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            background: #ccfbf1;
            color: var(--primary-dark);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--muted);
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text);
            background-color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .currency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .currency-col {
            flex: 1;
        }

        .swap-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }

        .swap-btn:hover {
            background: var(--primary-dark);
            transform: rotate(180deg);
        }

        .result-box {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-top: 10px;
        }

        .result-amount {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--primary);
            word-break: break-word;
        }

        .rate-info {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 6px;
        }

        .settings-toggle {
            display: block;
            width: 100%;
            background: none;
            border: 1px dashed var(--border);
            color: var(--muted);
            padding: 8px;
            border-radius: 8px;
            margin-top: 18px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .rates-panel {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .rates-panel.active {
            display: block;
        }

        .rates-panel p {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .rate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .rate-item span {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .rate-item input {
            width: 130px;
            padding: 6px 10px;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-save, .btn-reset {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: var(--primary);
            color: white;
        }

        .btn-reset {
            background: #e2e8f0;
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Ivunjisha ry'Amafaranga</h1>
        <span class="badge">Ikora Offline (Nta Internet)</span>
    </div>

    <div class="form-group">
        <label for="amount">Umubare w'amafaranga</label>
        <input type="number" id="amount" value="1000" min="0" step="any" placeholder="Andika umubare...">
    </div>

    <div class="currency-row">
        <div class="currency-col">
            <label for="fromCurrency">Kuva muri</label>
            <select id="fromCurrency"></select>
        </div>

        <button class="swap-btn" id="swapBtn" title="Hinduranya">?</button>

        <div class="currency-col">
            <label for="toCurrency">Kujya muri</label>
            <select id="toCurrency"></select>
        </div>
    </div>

    <div class="result-box">
        <div class="result-amount" id="resultDisplay">0 RWF</div>
        <div class="rate-info" id="rateDisplay">1 USD = 1,380 RWF</div>
    </div>

    <button class="settings-toggle" id="toggleRatesBtn">?? Hindura ibiciro by'ivunjisha (Rates)</button>

    <div class="rates-panel" id="ratesPanel">
        <p>Andika agaciro k'ifaranga rimwe (1) ugereranyije na <strong>RWF</strong>. Ibyo uhinduye bibikwa muri telefone/mudasobwa yawe:</p>
        <div id="ratesList"></div>
        <div class="btn-group">
            <button class="btn-save" id="saveRatesBtn">Bika Ibiciro</button>
            <button class="btn-reset" id="resetRatesBtn">Subiza iby'ibanze</button>
        </div>
    </div>
</div>

<script>
    const defaultRates = {
        RWF: 1,
        USD: 1380,
        EUR: 1490,
        GBP: 1750,
        KES: 10.7,
        UGX: 0.37,
        TZS: 0.52,
        BIF: 0.47,
        CDF: 0.49
    };

    const currencyNames = {
        RWF: "RWF - Amafaranga y'u Rwanda",
        USD: "USD - Idolari rya Amerika",
        EUR: "EUR - Iyero (Euro)",
        GBP: "GBP - Ipawundi (UK)",
        KES: "KES - Ishilingi rya Kenya",
        UGX: "UGX - Ishilingi rya Uganda",
        TZS: "TZS - Ishilingi rya Tanzaniya",
        BIF: "BIF - Ifaranga ry'u Burundi",
        CDF: "CDF - Ifaranga rya Kongo"
    };

    let rates = JSON.parse(localStorage.getItem('offline_exchange_rates')) || { ...defaultRates };

    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    const swapBtn = document.getElementById('swapBtn');
    const resultDisplay = document.getElementById('resultDisplay');
    const rateDisplay = document.getElementById('rateDisplay');
    const toggleRatesBtn = document.getElementById('toggleRatesBtn');
    const ratesPanel = document.getElementById('ratesPanel');
    const ratesList = document.getElementById('ratesList');
    const saveRatesBtn = document.getElementById('saveRatesBtn');
    const resetRatesBtn = document.getElementById('resetRatesBtn');

    function populateSelects() {
        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        Object.keys(rates).forEach(code => {
            const opt1 = document.createElement('option');
            opt1.value = code;
            opt1.textContent = currencyNames[code] || code;
            fromSelect.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = code;
            opt2.textContent = currencyNames[code] || code;
            toSelect.appendChild(opt2);
        });

        fromSelect.value = 'USD';
        toSelect.value = 'RWF';
    }

    function calculate() {
        const amount = parseFloat(amountInput.value);
        const from = fromSelect.value;
        const to = toSelect.value;

        if (isNaN(amount) || amount < 0) {
            resultDisplay.textContent = `0 ${to}`;
            return;
        }

        const amountInRWF = amount * rates[from];
        const converted = amountInRWF / rates[to];
        const unitRate = rates[from] / rates[to];

        resultDisplay.textContent = `${converted.toLocaleString('en-US', { maximumFractionDigits: 2 })} ${to}`;
        rateDisplay.textContent = `1 ${from} = ${unitRate.toLocaleString('en-US', { maximumFractionDigits: 4 })} ${to}`;
    }

    function renderRateInputs() {
        ratesList.innerHTML = '';
        Object.keys(rates).forEach(code => {
            if (code === 'RWF') return;
            const div = document.createElement('div');
            div.className = 'rate-item';
            div.innerHTML = `
                <span>1 ${code} (mu RWF):</span>
                <input type="number" step="any" data-code="${code}" value="${rates[code]}">
            `;
            ratesList.appendChild(div);
        });
    }

    swapBtn.addEventListener('click', () => {
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        calculate();
    });

    toggleRatesBtn.addEventListener('click', () => {
        ratesPanel.classList.toggle('active');
        if (ratesPanel.classList.contains('active')) {
            renderRateInputs();
        }
    });

    saveRatesBtn.addEventListener('click', () => {
        const inputs = ratesList.querySelectorAll('input');
        inputs.forEach(input => {
            const code = input.getAttribute('data-code');
            const val = parseFloat(input.value);
            if (!isNaN(val) && val > 0) {
                rates[code] = val;
            }
        });
        localStorage.setItem('offline_exchange_rates', JSON.stringify(rates));
        calculate();
        ratesPanel.classList.remove('active');
    });

    resetRatesBtn.addEventListener('click', () => {
        rates = { ...defaultRates };
        localStorage.removeItem('offline_exchange_rates');
        renderRateInputs();
        calculate();
    });

    amountInput.addEventListener('input', calculate);
    fromSelect.addEventListener('change', calculate);
    toSelect.addEventListener('change', calculate);

    populateSelects();
    calculate();
</script>

</body>
</html>
